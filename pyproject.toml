[project]
name = "dq-framework"
version = "0.1.0"
description = "A PySpark-based local data quality framework for comparing datasets and finding primary keys"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0.5",
    "pyarrow>=25.0.0",
    "pyspark>=4.2.0",
]

[project.scripts]
dq-framework = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
