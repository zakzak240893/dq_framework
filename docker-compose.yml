services:
  spark-master:
    image: apache/spark:3.5.1
    container_name: spark-master
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    ports:
      - "7077:7077"
      - "8081:8080"
      - "4040:4040"
    volumes:
      - spark-master-data:/opt/spark/warehouse
      - ./data:/app/data
    networks:
      - spark-network
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8080'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  spark-worker-1:
    image: apache/spark:3.5.1
    container_name: spark-worker-1
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - --cores
      - "1"
      - --memory
      - 2g
      - spark://spark-master:7077
    depends_on:
      spark-master:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    networks:
      - spark-network

  spark-worker-2:
    image: apache/spark:3.5.1
    container_name: spark-worker-2
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - --cores
      - "1"
      - --memory
      - 2g
      - spark://spark-master:7077
    depends_on:
      spark-master:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    networks:
      - spark-network

  spark-worker-3:
    image: apache/spark:3.5.1
    container_name: spark-worker-3
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - --cores
      - "1"
      - --memory
      - 2g
      - spark://spark-master:7077
    depends_on:
      spark-master:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    networks:
      - spark-network

  dq-runner:
    image: apache/spark:3.5.1
    container_name: dq-runner
    depends_on:
      spark-master:
        condition: service_healthy
    working_dir: /app
    volumes:
      - ./:/app
    networks:
      - spark-network
    command:
      - /opt/spark/bin/spark-submit
      - --master
      - spark://spark-master:7077
      - --deploy-mode
      - client
      - /app/main.py
      - --config
      - /app/dq_setup.json
      - --remote
      - --master
      - spark://spark-master:7077
    profiles:
      - dq

networks:
  spark-network:
    driver: bridge

volumes:
  spark-master-data: